<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ePI type 4 demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" rel="stylesheet">
  <style>.CodeMirror { height: 420px; border: 1px solid #dee2e6; font-size: 13px; }</style>
</head>
<body>
<main class="container-fluid py-4">
  <h1 class="h3 mb-3">ePI type 4 demo</h1>
  <div class="row g-3">
    <div class="col-md-6">
      <h2 class="h6">Source FHIR bundle (editable, loaded from <code>data/source-bundle.xml</code>)</h2>
      <textarea id="left-xml"></textarea>
    </div>
    <div class="col-md-6">
      <h2 class="h6">Generated FHIR bundle</h2>
      <textarea id="right-xml"></textarea>
    </div>
  </div>
  <div class="my-3 d-flex gap-2">
    <button id="generate" class="btn btn-primary" type="button">Generate</button>
    <button id="render" class="btn btn-primary" type="button">Render</button>
  </div>
  <div id="error" class="alert alert-danger d-none" role="alert" style="white-space: pre-wrap"></div>
  <h2 class="h6">Rendered output</h2>
  <div id="rendered" class="border rounded p-3 bg-white"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="vendor/SaxonJS2.rt.js"></script>
<script src="js/app.js"></script>
</body>
</html>
